# BALANCE: HTTPS-конфигурация nginx.
# Самоподписанный сертификат генерируется автоматически при старте контейнера
# в /etc/nginx/ssl (см. docker-entrypoint.d/40-gen-certs.sh).

# --- Редирект HTTP → HTTPS ---
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# --- HTTPS (основной сервер) ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/balance.crt;
    ssl_certificate_key /etc/nginx/ssl/balance.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Статика (React SPA) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Проксирование API на backend-контейнер (Docker Compose сеть) ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- Заголовки безопасности ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
